<!DOCTYPE html>
<!--
  ConfGuide — Trang Báo lỗi 404 Not Found (404.html)
  Hiển thị thông báo trang không tồn tại và nút điều hướng quay lại trang chủ.
-->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Không tìm thấy trang | ConfGuide</title>
  <meta name="description" content="Trang bạn đang tìm kiếm không tồn tại. Quay lại trang chủ ConfGuide để tra cứu và theo dõi hội nghị khoa học CNTT tại Việt Nam.">
  <meta name="robots" content="noindex, follow">

  <!-- Tự động neo đường dẫn gốc khi 404.html được server trả về ở URL lồng nhiều cấp (VD: /thu-muc/loi) -->
  <script>
    (function () {
      try {
        if (window.location.protocol === 'file:') return;
        const pathname = window.location.pathname || '/';
        const trimmed = pathname.replace(/^\/+/, '');
        if (!trimmed || !trimmed.includes('/')) return;
        const repoPrefix = pathname.startsWith('/confeguide/') ? '/confeguide/' : '/';
        const baseEl = document.createElement('base');
        baseEl.setAttribute('href', repoPrefix);
        document.head.appendChild(baseEl);
      } catch (e) {}
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="stylesheet" href="css/base/base.css">
  <link rel="stylesheet" href="css/pages/404.css">
  <link rel="stylesheet" href="css/base/transition.css">
  <script src="js/core/page-transition.js"></script>
  <script src="js/core/layout.js" defer blocking="render"></script>
</head>
<body data-page="404">
  <!-- Áp dụng nhanh Dark Mode trước khi sơn giao diện để tránh nhấp nháy sáng/tối (anti-FOUC) -->
  <script>try { if (localStorage.getItem('confguide_theme') === 'dark') document.body.classList.add('dark'); } catch (e) {}</script>

  <!-- Thanh điều hướng dùng chung được render bởi js/core/layout.js -->
  <div id="site-header"></div>

  <!-- Nội dung chính báo lỗi 404 căn giữa màn hình -->
  <main id="mainContent" class="not-found-page">
    <section class="nf-hero" aria-labelledby="nfHeading">
      <div class="container nf-hero__inner">
        <h1 id="nfHeading" class="nf-hero__code">404</h1>
        <p class="nf-hero__message">Trang bạn đang tìm kiếm không tồn tại.</p>
        <a href="index.html" class="btn btn-primary nf-hero__btn">
          <span aria-hidden="true">&larr;</span>
          <span>Quay lại trang chủ</span>
        </a>
      </div>
    </section>
  </main>

  <!-- Chân trang dùng chung được render bởi js/core/layout.js -->
  <div id="site-footer"></div>
</body>
</html>
